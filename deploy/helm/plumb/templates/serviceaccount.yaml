{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plumb.serviceAccountName" . }}
  labels:
    {{- include "plumb.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Plumb never calls the Kubernetes API, so it has no use for a mounted token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
