{{- if .Values.bridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plumb.fullname" . }}
  labels:
    {{- include "plumb.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: bridge
      port: {{ .Values.service.port }}
      targetPort: bridge
      protocol: TCP
  {{- /*
    Selects the bridge only. Without the component label this would also match
    the `helm test` pod and every verify Job pod, enrolling them as endpoints.
  */}}
  selector:
    {{- include "plumb.bridgeSelectorLabels" . | nindent 4 }}
{{- end }}
