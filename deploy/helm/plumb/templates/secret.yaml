{{- if and (not .Values.figma.existingSecret) .Values.figma.token }}
{{- /*
  Convenience only. This puts the token in the Helm release history, which is
  stored in a Secret in the release namespace and visible to anyone who can run
  `helm get values`. Set `figma.existingSecret` instead for anything real.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-figma" (include "plumb.fullname" .) }}
  labels:
    {{- include "plumb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "plumb.figmaSecretKey" . }}: {{ .Values.figma.token | quote }}
{{- end }}
---
{{- if include "plumb.createsAssetSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-assets" (include "plumb.fullname" .) }}
  labels:
    {{- include "plumb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.assetProviders.unsplashAccessKey }}
  UNSPLASH_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.assetProviders.pexelsApiKey }}
  PEXELS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.assetProviders.pixabayApiKey }}
  PIXABAY_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.assetProviders.googleFontsApiKey }}
  GOOGLE_FONTS_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
