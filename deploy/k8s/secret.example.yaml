# EXAMPLE — do not commit a filled-in copy of this file.
#
# Only needed for the Figma REST tools (plumb_fig_outline / plumb_fig_node) and
# the verify/fit CLIs. The plugin path needs no token at all, which is why the
# generated manifests don't reference this Secret unless it exists.
#
# In a real cluster, prefer External Secrets, Sealed Secrets, SOPS, or your
# cloud provider's secret store over a Secret you apply by hand.
#
#   kubectl -n plumb create secret generic plumb-figma \
#     --from-literal=FIGMA_TOKEN=figd_your_read_only_token
apiVersion: v1
kind: Secret
metadata:
  name: plumb-figma
  namespace: plumb
type: Opaque
stringData:
  FIGMA_TOKEN: figd_replace_me
