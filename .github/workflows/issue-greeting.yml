name: Issue greeting

# Posts an acknowledgement on every newly opened issue so reporters know it
# landed and what happens next, even before a maintainer gets to it. Issues
# opened by the repo owner are skipped.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  greet:
    if: github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const body = [
              `Thanks for opening this, @${author}! 👋`,
              "",
              "This is an automated note to let you know the issue has been received. A maintainer will read it and follow up here.",
              "",
              "In the meantime, it helps to include, if you haven't already:",
              "- your `plumb-mcp` version (`npx plumb-mcp --version`)",
              "- whether you're on the plugin path or the REST path",
              "- the tool call and the output you got",
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
