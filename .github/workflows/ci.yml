name: CI

# Runs on every push and pull request — typecheck, lint, test (with a coverage
# floor), the offline demo, a production dependency audit, a full build, a
# container build, and the whole Terraform/Helm/Kubernetes surface must all pass
# before code reaches `main`. Unlike release.yml (which only fires on a version
# tag), this is the check that gates day-to-day changes.

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Fails the build on a high-or-worse advisory in anything that actually
      # ships. Dev-only findings are reported below without blocking, because
      # a build-tool advisory in vite/esbuild reaches no user of this package
      # and shouldn't be able to stop a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory)
        run: npm audit --audit-level=high || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # The demo is a claim about what the verify engine catches. It exits
      # non-zero if it ever misses a planted fault or invents one, so run it
      # here rather than trusting the README.
      - name: Offline demo (self-check)
        run: npm run demo -- --json

      - name: Build (server + plugin + studio)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Terraform, the Helm chart, the generated Kubernetes manifests, both image
  # targets, and the policy scanners. Kept in its own file because it is a
  # sizeable workflow in its own right, but invoked from here so that one
  # status check covers everything a change can break.
  iac:
    name: Infrastructure
    uses: ./.github/workflows/iac.yml
    permissions:
      contents: read
      security-events: write

  # A container image nobody builds is a container image that has stopped
  # working. This proves a fresh clone comes up in isolation — and that the
  # demo passes with networking switched off entirely.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker compose build demo

      - name: Run the demo with no network access
        run: docker compose up --exit-code-from demo demo
