name: CI

# Runs on every push and pull request — typecheck, test, lint, and build must
# all pass before code reaches `main`. Unlike release.yml (which only fires
# on a version tag and previously stopped at typecheck+build+smoke, never
# running the Vitest suite at all), this is the check that actually gates
# day-to-day changes.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (server + plugin)
        run: npm run build
