name: IaC

# Infrastructure that nobody validates is infrastructure that has already
# stopped working. Every artifact under deploy/ is linted, rendered,
# schema-checked, and policy-scanned here — and the plain manifests are
# regenerated from the chart and diffed, so the two copies can never drift
# apart.
#
# Called by ci.yml on every push and pull request rather than triggered
# separately, so there is one entry point that gates a change and `ci.yml`
# visibly covers the Terraform and Kubernetes code. It stays independently
# dispatchable for a manual re-run.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint (defaults)
        run: helm lint deploy/helm/plumb

      - name: Lint (every feature enabled)
        run: helm lint deploy/helm/plumb --values .github/values/full.yaml

      # Rendered output validated against the real Kubernetes API schemas, on
      # the oldest and newest versions we claim to support.
      - name: Validate rendered manifests
        run: |
          for version in 1.27.0 1.31.0; do
            echo "── Kubernetes $version ──"
            helm template plumb deploy/helm/plumb \
              | kubeconform -strict -summary -kubernetes-version "$version" -
            helm template plumb deploy/helm/plumb --values .github/values/full.yaml \
              | kubeconform -strict -summary -kubernetes-version "$version" -
          done

      # A values schema that has quietly stopped validating is worse than none,
      # because it reads like a guarantee. Prove it still rejects.
      - name: Values schema rejects bad input
        run: |
          set +e
          fail=0
          assert_rejected() {
            local desc="$1"; shift
            if helm template plumb deploy/helm/plumb "$@" >/dev/null 2>&1; then
              echo "✗ schema accepted what it must reject: $desc"
              fail=1
            else
              echo "✓ rejected: $desc"
            fi
          }
          assert_rejected "an unknown Service type"          --set service.type=Weird
          assert_rejected "more than one bridge replica"     --set bridge.replicaCount=3
          assert_rejected "an unknown log level"             --set bridge.logLevel=chatty
          assert_rejected "a Figma node id using '-'" \
            --set verify.enabled=true \
            --set-json 'verify.targets=[{"name":"x","url":"http://a/","node":"190-109884"}]'
          assert_rejected "a target URL that is not http(s)" \
            --set verify.enabled=true \
            --set-json 'verify.targets=[{"name":"x","url":"ftp://a/","node":"1:2"}]'
          exit $fail

      # The template's own guard rails, which produce better messages than a
      # schema can.
      - name: Template guards reject bad input
        run: |
          set +e
          fail=0
          if helm template plumb deploy/helm/plumb --set verify.enabled=true >/dev/null 2>&1; then
            echo "✗ verify.enabled with no targets should fail"; fail=1
          else
            echo "✓ rejected: verify.enabled with no targets"
          fi
          if helm template plumb deploy/helm/plumb \
               --set verify.enabled=true \
               --set-json 'verify.targets=[{"name":"x","url":"http://a/","node":"1:2"}]' >/dev/null 2>&1; then
            echo "✗ verify.enabled with no Figma token should fail"; fail=1
          else
            echo "✓ rejected: verify.enabled with no Figma token"
          fi
          # `plumb-mcp verify` resolves a node against a file key. A target
          # without one produces a CronJob that can never succeed — found by
          # actually running it on a cluster, not by reading the template.
          if helm template plumb deploy/helm/plumb \
               --set figma.token=t --set verify.enabled=true \
               --set-json 'verify.targets=[{"name":"x","url":"http://a/","node":"1:2"}]' >/dev/null 2>&1; then
            echo "✗ a verify target with no Figma file key should fail"; fail=1
          else
            echo "✓ rejected: a verify target with no Figma file key"
          fi
          # …and the same config WITH a file key must still render.
          if helm template plumb deploy/helm/plumb \
               --set figma.token=t --set verify.enabled=true --set verify.fileKey=abc \
               --set-json 'verify.targets=[{"name":"x","url":"http://a/","node":"1:2"}]' >/dev/null 2>&1; then
            echo "✓ accepted: a complete verify target"
          else
            echo "✗ a complete verify target should render"; fail=1
          fi
          exit $fail

  manifests:
    name: Generated manifests are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Regenerate
        run: npm run deploy:manifests

      - name: Fail if they drifted from the chart
        run: |
          if ! git diff --exit-code deploy/k8s; then
            echo
            echo "deploy/k8s/plumb.yaml is out of date with the Helm chart."
            echo "Run \`npm run deploy:manifests\` and commit the result."
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      # kubectl is no longer preinstalled on ubuntu-latest, and `kubectl
      # kustomize` is what the k8s/ directory documents.
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Validate the kustomize build
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -kubernetes-version 1.31.0 -

  # Policy scanning. Two tools because they disagree usefully: Trivy gates on
  # HIGH/CRITICAL across the Dockerfile, the Kubernetes manifests and the
  # Terraform module in one pass (it is tfsec's maintained successor); Checkov
  # gates on ANY failed check, since open-source Checkov has no severities.
  # Every Checkov suppression is listed and justified in .checkov.yaml.
  #
  # Both are installed as pinned CLIs and driven through `npm run deploy:scan`
  # — the same script a developer runs locally, so a clean local scan means a
  # clean CI scan. Deliberately not using the vendors' marketplace actions: a
  # security job should not pull unpinned third-party code to do its scanning,
  # and the two code paths would drift.
  policy:
    name: Policy scan (Trivy + Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Install Checkov
        run: |
          pipx install checkov==3.3.11
          checkov --version

      - name: Scan
        run: npm run deploy:scan

      # A gate nobody has watched fail is a gate nobody knows works. Feed the
      # scanners a manifest with the exact misconfigurations this chart takes
      # care to avoid, and require them to reject it. Runs against a temp
      # directory so nothing bad is ever committed.
      - name: The gate rejects a bad manifest
        run: |
          set +e
          bad="$(mktemp -d)"
          cat > "$bad/bad.yaml" <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: deliberately-insecure
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels: { app: bad }
            template:
              metadata:
                labels: { app: bad }
              spec:
                hostNetwork: true
                hostPID: true
                containers:
                  - name: bad
                    image: nginx:latest
                    securityContext:
                      privileged: true
                      runAsUser: 0
                      allowPrivilegeEscalation: true
                      readOnlyRootFilesystem: false
                      capabilities:
                        add: ["SYS_ADMIN"]
          YAML

          fail=0
          if trivy config "$bad" --severity HIGH,CRITICAL --exit-code 1 --disable-telemetry >/dev/null 2>&1; then
            echo "✗ Trivy accepted a privileged, host-networked, root container"
            fail=1
          else
            echo "✓ Trivy rejected it"
          fi
          if checkov --quiet --compact -d "$bad" >/dev/null 2>&1; then
            echo "✗ Checkov accepted a privileged, host-networked, root container"
            fail=1
          else
            echo "✓ Checkov rejected it"
          fi
          rm -rf "$bad"
          exit $fail

      # The same scan again as SARIF, so findings land in the Security tab
      # rather than only in a failed job's log. Never gates — the run above
      # already did.
      - name: Trivy SARIF for code scanning
        if: always()
        run: |
          trivy config . \
            --format sarif --output trivy.sarif \
            --exit-code 0 --disable-telemetry \
            --skip-dirs '**/node_modules' --skip-dirs '**/.terraform'

      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-config

  terraform:
    name: Terraform module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      - name: Validate the module
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate

      - name: Validate the example
        run: |
          terraform -chdir=deploy/terraform/examples/minimal init -backend=false -input=false
          terraform -chdir=deploy/terraform/examples/minimal validate

  images:
    name: Both image targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # The default target must stay the slim server image. `verifier` is
      # declared before `runner` in the Dockerfile precisely so a plain
      # `docker build .` doesn't start shipping the 1.3 GB browser image.
      - name: Default target is the slim runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plumb-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The offline demo passes inside the image
        run: docker run --rm plumb-mcp:ci demo --json

      - name: Verifier target builds and carries a browser
        uses: docker/build-push-action@v6
        with:
          context: .
          target: verifier
          load: true
          tags: plumb-mcp:ci-verifier
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chromium under the exact securityContext the chart applies: non-root,
      # read-only root filesystem, all capabilities dropped. This is where a
      # hardened pod usually falls over, so prove it here rather than in a
      # 3 a.m. CronJob failure.
      - name: Chromium renders under the pod's security constraints
        run: |
          docker run --rm \
            --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=256m --tmpfs /dev/shm:rw,size=512m \
            --entrypoint /usr/bin/chromium plumb-mcp:ci-verifier \
            --headless=new --disable-gpu --no-first-run --no-sandbox \
            --user-data-dir=/tmp/prof --dump-dom \
            'data:text/html,<h1>plumb</h1>' 2>/dev/null | grep -q '<h1>plumb</h1>'
          echo "✓ Chromium rendered a page read-only, non-root, no capabilities"
