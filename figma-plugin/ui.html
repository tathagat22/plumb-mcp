<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--figma-color-text, #1a1a1a);
    background: var(--figma-color-bg, #fff);
  }

  /* expanded panel */
  #panel { padding: 12px; display: flex; flex-direction: column;
    gap: 6px; height: 100%; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%;
    background: #c0392b; flex: none; }
  .dot.wait { background: #f39c12; }
  .dot.on { background: #2ecc71; }
  #title { font-weight: 600; }
  #status {
    color: var(--figma-color-text-secondary, #666);
    font-size: 11px; min-height: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #actions { display: flex; gap: 6px; margin-top: auto; }
  button {
    font: inherit; font-size: 12px; padding: 7px 10px; flex: 1;
    border: 0; border-radius: 5px;
    background: var(--figma-color-bg-brand, #8b6cff);
    color: var(--figma-color-text-onbrand, #fff);
    cursor: pointer; font-weight: 600;
  }
  button:disabled {
    background: var(--figma-color-bg-disabled, #e6e6e6);
    color: var(--figma-color-text-disabled, #999);
    cursor: default; font-weight: 400;
  }
  button.ghost {
    background: var(--figma-color-bg-secondary, #f1f1f4);
    color: var(--figma-color-text, #555);
  }
  button.ghost:hover {
    background: var(--figma-color-bg-hover, #e8e8ec);
  }

  /* collapsed dot — fills whatever window size we end up at */
  #collapsed {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center; cursor: pointer;
    background: var(--figma-color-bg, #fff);
  }
  #bigdot {
    width: 26px; height: 26px; border-radius: 50%;
    background: #c0392b; box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    transition: transform .1s;
  }
  #bigdot.wait { background: #f39c12; }
  #bigdot.on { background: #2ecc71; }
  #collapsed:hover #bigdot { transform: scale(1.15); }

  body.mini #panel { display: none; }
  body.mini #collapsed { display: flex; }
</style>
</head>
<body>
  <div id="panel">
    <div class="row"><div class="dot" id="dot"></div><span id="title">Plumb</span></div>
    <div id="status">Connecting…</div>
    <div id="actions">
      <button id="pair" disabled>Pair</button>
      <button id="hide" class="ghost">Minimize</button>
    </div>
  </div>
  <div id="collapsed" title="Click to expand"><div id="bigdot"></div></div>
<script>
  var PORTS = [31337, 31338, 31339, 31340, 31341];
  var PLUGIN_VERSION = "0.0.1";
  var ws = null, paired = false, autoPair = false, portIdx = 0, helloTimer = null;
  var lastSelection = null, lastInventory = null;

  var dot = document.getElementById("dot");
  var bigdot = document.getElementById("bigdot");
  var statusEl = document.getElementById("status");
  var pairBtn = document.getElementById("pair");
  var hideBtn = document.getElementById("hide");
  var collapsed = document.getElementById("collapsed");

  function setState(cls, text) {
    dot.className = "dot" + (cls ? " " + cls : "");
    bigdot.className = cls ? cls : "";
    if (text !== undefined) statusEl.textContent = text;
  }

  function refreshStatus() {
    if (!paired) return;
    var bits = [];
    if (lastInventory) {
      var n = lastInventory.pages.reduce(function (acc, p) {
        return acc + p.frames.length;
      }, 0);
      bits.push(n + " screens");
    }
    if (lastSelection && lastSelection.nodeName) {
      var s = lastSelection.nodeName;
      bits.push("· " + (s.length > 22 ? s.slice(0, 22) + "…" : s));
    }
    statusEl.textContent = bits.length ? bits.join(" ") : "Paired";
  }

  function toMain(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function connect() {
    var port = PORTS[portIdx % PORTS.length];
    portIdx++;
    try { ws = new WebSocket("ws://127.0.0.1:" + port); }
    catch (e) { setTimeout(connect, 1500); return; }

    ws.onopen = function () {
      helloTimer = setTimeout(function () { try { ws.close(); } catch (e) {} }, 1500);
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.t === "plumb-hello") {
        if (helloTimer) { clearTimeout(helloTimer); helloTimer = null; }
        if (autoPair) {
          setState("wait", "Pairing…");
          send({ t: "pair", pluginVersion: PLUGIN_VERSION });
        } else {
          setState("wait", "Not paired");
          pairBtn.disabled = false;
        }
      } else if (msg.t === "paired") {
        paired = true;
        pairBtn.disabled = true;
        pairBtn.textContent = "Paired";
        setState("on");
        refreshStatus();
        toMain({ type: "paired" });
        toMain({ type: "resync" });
      } else if (msg.t === "pair-rejected") {
        setState("wait", msg.reason || "Pairing rejected");
      } else if (msg.t === "get-node" || msg.t === "get-assets") {
        toMain({ type: "server-request", req: msg });
      } else if (msg.t === "ping") {
        send({ t: "pong" });
      }
    };

    ws.onclose = function () {
      if (helloTimer) { clearTimeout(helloTimer); helloTimer = null; }
      paired = false;
      pairBtn.disabled = true;
      pairBtn.textContent = "Pair";
      setState("", "Disconnected — retrying…");
      setTimeout(connect, 1500);
    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  pairBtn.onclick = function () {
    send({ t: "pair", pluginVersion: PLUGIN_VERSION });
    setState("wait", "Pairing…");
  };

  hideBtn.onclick = function () {
    document.body.classList.add("mini");
    toMain({ type: "collapse" });
  };

  collapsed.onclick = function () {
    document.body.classList.remove("mini");
    toMain({ type: "expand" });
  };

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg || !msg.type) return;
    if (msg.type === "init") {
      autoPair = msg.autoPair === true;
      if (autoPair) {
        document.body.classList.add("mini");
        toMain({ type: "collapse" });
      }
    } else if (msg.type === "selection") {
      lastSelection = msg;
      refreshStatus();
      if (paired) {
        send({ t: "selection", doc: msg.doc, fileName: msg.fileName,
          pageName: msg.pageName, nodeName: msg.nodeName });
      }
    } else if (msg.type === "inventory") {
      lastInventory = msg;
      refreshStatus();
      if (paired) {
        send({ t: "inventory", fileName: msg.fileName, pages: msg.pages });
      }
    } else if (msg.type === "plugin-reply") {
      send(msg.reply);
    }
  };

  connect();
</script>
</body>
</html>
